# Nginx API Gateway Configuration for NavDU Startups (UZ Combinator)
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Services
    upstream cms_backend {
        server cms-service:8001;
    }

    upstream application_backend {
        server application-service:8002;
    }

    upstream startup_backend {
        server startup-service:8003;
    }

    upstream event_backend {
        server event-service:8004;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Client Proxy (Vite / Static)
        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Yagona Markaziy Super Admin Panel (Barcha modellar jamlangan)
        location /admin/ {
            proxy_pass http://cms_backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /static/ {
            proxy_pass http://cms_backend/static/;
            proxy_set_header Host $host;
        }

        # 1. CMS & Layout Service (Frontend Boshqaruv)
        location /api/v1/cms/ {
            proxy_pass http://cms_backend/api/v1/cms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Application Service (45 kunlik arizalar & OTP)
        location /api/v1/applications/ {
            proxy_pass http://application_backend/api/v1/applications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/apps/ {
            proxy_pass http://application_backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Startups & Upvote Service
        location /api/v1/startups/ {
            proxy_pass http://startup_backend/api/v1/startups/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Events & Ticketing Service
        location /api/v1/events/ {
            proxy_pass http://event_backend/api/v1/events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/events/ {
            proxy_pass http://event_backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
