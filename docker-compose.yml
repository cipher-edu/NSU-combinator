services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nsucombinator
      POSTGRES_USER: nsucombinator
      POSTGRES_PASSWORD: nsucombinator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsucombinator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--threads", "2", "--timeout", "60"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SKIP_COLLECTSTATIC: "true"
    volumes:
      - ./backend:/app
      - media_public:/app/media/public
      - media_private:/app/media/private
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "2"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SKIP_SETUP: "true"
    volumes:
      - ./backend:/app
    depends_on:
      - api

  celery_beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SKIP_SETUP: "true"
    volumes:
      - ./backend:/app
    depends_on:
      - api

  telegram_bot:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "manage.py", "run_telegram_bot"]
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SKIP_SETUP: "true"
    volumes:
      - ./backend:/app
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      API_PROXY_TARGET: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  media_public:
  media_private:
  frontend_node_modules:
